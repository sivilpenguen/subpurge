name: Update Pricing Data

on:
  schedule:
    - cron: '0 3 * * 1'   # Her Pazartesi 03:00 UTC
  workflow_dispatch:        # Manuel tetikleme

permissions:
  contents: write
  pull-requests: write
  models: read            # GitHub Models (free tier) for web price extraction

jobs:
  pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      # 1) Turkey web prices: hand-written scrapers
      - name: Turkey web scrapers
        continue-on-error: true
        run: |
          node scripts/scrape-tr-pricing.js
          node scripts/scrape-tr-pricing-puppeteer.js

      # 2) App Store prices for every country (storefront is in the URL)
      - name: App Store prices
        continue-on-error: true
        run: node scripts/pricing/fetch-appstore.mjs

      # 3) Web prices for other countries via GitHub Models
      - name: Web prices (GitHub Models)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pricing/fetch-web.mjs

      - name: Build country files
        run: node scripts/pricing/build.mjs

      - name: Check for large changes
        id: check
        run: node scripts/pricing/check-changes.mjs

      # Normal weeks: straight to main. A price that moved >50% or vanished: pull request for review.
      - name: Commit updated pricing data
        if: steps.check.outputs.needs_review != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pricing-tr.json data/pricing/
          git diff --staged --quiet || git commit -m "chore: update pricing data [skip ci]"
          # main may have moved during the ~30 min run
          git pull --rebase origin main
          git push

      - name: Open review pull request
        if: steps.check.outputs.needs_review == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: pricing/review
          commit-message: "chore: update pricing data (needs review)"
          title: "Fiyat güncellemesi: kontrol gerekiyor"
          body-path: data/pricing/REVIEW.md
          add-paths: |
            data/pricing-tr.json
            data/pricing/
